name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: build, offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      # Offline only -- exercises pure logic (CBOR codec, manifest
      # chunking/Merkle root) and the 15 golden byte-exact frame vectors,
      # all without touching the network. The live examples and
      # `Category=Live` tests all dial the real production fleet
      # (station-de-frankfurt.macula.io), which has no uptime guarantee
      # and must never block an unrelated PR -- same convention the
      # sibling Go/Rust/PHP SDKs all use for their own live-tagged tests.
      # Run those manually:
      #   dotnet test --filter Category=Live
      - run: dotnet test --no-build --configuration Release --filter "Category!=Live"
