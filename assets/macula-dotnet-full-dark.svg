<?xml version="1.0" encoding="UTF-8"?>
<!-- Option D Final: Irregular mesh full logo (dark theme) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 72" width="240" height="72">
  <!-- Icon -->
  <g transform="translate(4, 0) scale(0.64)">
    <!-- Subtle grid -->
    <g stroke="#38BDF8" stroke-width="0.5" opacity="0.08">
      <line x1="0" y1="25" x2="100" y2="25"/>
      <line x1="0" y1="50" x2="100" y2="50"/>
      <line x1="0" y1="75" x2="100" y2="75"/>
      <line x1="25" y1="0" x2="25" y2="100"/>
      <line x1="50" y1="0" x2="50" y2="100"/>
      <line x1="75" y1="0" x2="75" y2="100"/>
    </g>

    <!-- Irregular mesh connections -->
    <g stroke="#38BDF8" stroke-width="1.5" fill="none">
      <line x1="22" y1="20" x2="50" y2="32"/>
      <line x1="50" y1="32" x2="78" y2="18"/>
      <line x1="22" y1="20" x2="15" y2="52"/>
      <line x1="78" y1="18" x2="85" y2="45"/>
      <line x1="15" y1="52" x2="35" y2="55"/>
      <line x1="35" y1="55" x2="50" y2="50"/>
      <line x1="50" y1="50" x2="68" y2="48"/>
      <line x1="68" y1="48" x2="85" y2="45"/>
      <line x1="15" y1="52" x2="28" y2="80"/>
      <line x1="35" y1="55" x2="50" y2="78"/>
      <line x1="50" y1="50" x2="50" y2="78"/>
      <line x1="68" y1="48" x2="72" y2="75"/>
      <line x1="85" y1="45" x2="72" y2="75"/>
      <line x1="28" y1="80" x2="50" y2="78"/>
      <line x1="50" y1="78" x2="72" y2="75"/>
      <line x1="22" y1="20" x2="35" y2="55" stroke-dasharray="3,2" opacity="0.5"/>
      <line x1="78" y1="18" x2="68" y2="48" stroke-dasharray="3,2" opacity="0.5"/>
      <line x1="50" y1="32" x2="50" y2="50" stroke-dasharray="3,2" opacity="0.5"/>
    </g>

    <!-- Orange accents -->
    <g stroke="#FB923C" stroke-width="2" fill="none">
      <line x1="35" y1="55" x2="68" y2="48"/>
      <line x1="50" y1="32" x2="35" y2="55" stroke-dasharray="4,3"/>
    </g>

    <!-- Primary nodes -->
    <g stroke="#38BDF8" stroke-width="2" fill="#1E293B">
      <circle cx="22" cy="20" r="4"/>
      <circle cx="78" cy="18" r="4"/>
      <circle cx="15" cy="52" r="3"/>
      <circle cx="85" cy="45" r="3"/>
      <circle cx="28" cy="80" r="4"/>
      <circle cx="72" cy="75" r="4"/>
    </g>

    <!-- Hub nodes - white -->
    <g stroke="#38BDF8" stroke-width="2" fill="#F8FAFC">
      <circle cx="50" cy="32" r="4"/>
      <circle cx="50" cy="78" r="4"/>
    </g>

    <!-- Central hub -->
    <circle cx="50" cy="50" r="7" stroke="#38BDF8" stroke-width="2" fill="#1E293B"/>
    <circle cx="50" cy="50" r="3.5" fill="#38BDF8"/>

    <!-- Secondary nodes -->
    <g stroke="#38BDF8" stroke-width="1.5" fill="#1E293B">
      <circle cx="35" cy="55" r="3"/>
      <circle cx="68" cy="48" r="3"/>
    </g>
    <g fill="#FB923C">
      <circle cx="35" cy="55" r="1.5"/>
      <circle cx="68" cy="48" r="1.5"/>
    </g>
  </g>

  <!-- Wordmark - centered vertically -->
  <text x="76" y="42"
        font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace"
        font-size="32"
        font-weight="600"
        fill="#38BDF8"
        letter-spacing="-0.5px">MACULA</text>

  <!-- Official Microsoft .NET logo badge (dotnet/brand repo,
       CC0 1.0 Universal), replacing the earlier C#-specific badge
       now that this repo spans C# and F# examples over a plain
       .NET assembly, not one language. Styled as an enlarged hub
       node, matching the Go/Rust/PHP badge treatment. The
       circle's own fill is the logo's own brand purple, since
       that's intrinsic to the mark (a colored square plus a white
       glyph), not a separate background choice. -->
  <circle cx="54" cy="54" r="13" fill="#512BD4" stroke="#38BDF8" stroke-width="2"/>
  <g transform="translate(43.000, 43.000) scale(0.048246)"><path d="M81.2738 291.333C78.0496 291.333 75.309 290.259 73.052 288.11C70.795 285.906 69.6665 283.289 69.6665 280.259C69.6665 277.173 70.795 274.529 73.052 272.325C75.309 270.121 78.0496 269.019 81.2738 269.019C84.5518 269.019 87.3193 270.121 89.5763 272.325C91.887 274.529 93.0424 277.173 93.0424 280.259C93.0424 283.289 91.887 285.906 89.5763 288.11C87.3193 290.259 84.5518 291.333 81.2738 291.333Z" fill="white"/><path d="M210.167 289.515H189.209L133.994 202.406C132.597 200.202 131.441 197.915 130.528 195.546H130.044C130.474 198.081 130.689 203.508 130.689 211.827V289.515H112.149V171H134.477L187.839 256.043C190.096 259.57 191.547 261.994 192.192 263.316H192.514C191.977 260.176 191.708 254.859 191.708 247.365V171H210.167V289.515Z" fill="white"/><path d="M300.449 289.515H235.561V171H297.87V187.695H254.746V221.249H294.485V237.861H254.746V272.903H300.449V289.515Z" fill="white"/><path d="M392.667 187.695H359.457V289.515H340.272V187.695H307.143V171H392.667V187.695Z" fill="white"/></g>
</svg>
